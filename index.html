<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB610 SYSTEMS</title>
  <meta name="description" content="BB610 SYSTEMS — Garden, Water, Market, Berry.">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="page">
    <div class="page-glow" aria-hidden="true"></div>

    <div class="container">
      <header class="site-logo" aria-label="BB610 SYSTEMS">
        <img class="site-logo-image" src="./assets/bb610-systems.webp" alt="BB610 SYSTEMS">
      </header>

      <section class="grid" aria-label="Напрями BB610">
        <a class="card garden" href="https://garden.bb610.com.ua/">
          <img class="card-image" src="./assets/garden.jpg" alt="">
          <div class="card-fade"></div>
          <div class="card-content">
            <div>
              <div class="direction-logo-crop garden-logo"><img class="card-logo" src="./assets/bb610-garden.webp" alt="GARDEN"></div>
              <svg class="divider" viewBox="0 0 160 10"><path d="M0 7H62L80 1L98 7H160"/></svg>
            </div>
            <div class="card-bottom">
              <svg class="icon" viewBox="0 0 28 28"><path d="M20 4C10 4 4 10 4 18c0 1 .1 2 .4 2.9C9 12 15 9 20 8c-4 3-9 7-12.5 13.5C9 22.5 11 23 13 23c7 0 11-6 11-13V4h-4Z"/></svg>
              <p>Сад і вирощування.<br>Рішення для вашого саду.</p>
            </div>
          </div>
        </a>

        <a class="card water" href="https://water.bb610.com.ua/">
          <img class="card-image" src="./assets/water.jpg" alt="">
          <div class="card-fade"></div>
          <div class="card-content">
            <div>
              <div class="direction-logo-crop water-logo"><img class="card-logo" src="./assets/bb610-water.webp" alt="WATER"></div>
              <svg class="divider" viewBox="0 0 160 10"><path d="M0 7H62L80 1L98 7H160"/></svg>
            </div>
            <div class="card-bottom">
              <svg class="icon" viewBox="0 0 28 28"><path d="M14 3s8 8.6 8 14a8 8 0 1 1-16 0C6 11.6 14 3 14 3Z"/></svg>
              <p>Полив і фертигація.<br>Точне управління водою.</p>
            </div>
          </div>
        </a>

        <a class="card market" href="https://market.bb610.com.ua/">
          <img class="card-image" src="./assets/market.jpg" alt="">
          <div class="card-fade"></div>
          <div class="card-content">
            <div>
              <div class="direction-logo-crop market-logo"><img class="card-logo" src="./assets/bb610-market.webp" alt="MARKET"></div>
              <svg class="divider" viewBox="0 0 160 10"><path d="M0 7H62L80 1L98 7H160"/></svg>
            </div>
            <div class="card-bottom">
              <svg class="icon" viewBox="0 0 28 28"><path d="M2 4h3l3.2 12h12.3l2.5-8.5H6.6"/><circle cx="10" cy="22" r="1.8"/><circle cx="19" cy="22" r="1.8"/></svg>
              <p>Товари та обладнання.<br>Все для ефективної роботи.</p>
            </div>
          </div>
        </a>

        <a class="card berry" href="https://berry.bb610.com.ua/">
          <img class="card-image" src="./assets/berry.jpg" alt="">
          <div class="card-fade"></div>
          <div class="card-content">
            <div>
              <div class="direction-logo-crop berry-logo"><img class="card-logo" src="./assets/bb610-berry.webp" alt="BERRY"></div>
              <svg class="divider" viewBox="0 0 160 10"><path d="M0 7H62L80 1L98 7H160"/></svg>
            </div>
            <div class="card-bottom">
              <svg class="icon" viewBox="0 0 28 28"><circle cx="9" cy="17" r="5"/><circle cx="19" cy="17" r="5"/><circle cx="14" cy="8.5" r="5"/></svg>
              <p>Лохина і рослини.<br>Якість від посадки до врожаю.</p>
            </div>
          </div>
        </a>
      </section>

      <footer>
        <span>BB610 SYSTEMS</span><i></i><span>РОЗУМНІ РІШЕННЯ ДЛЯ ВАШОГО БІЗНЕСУ</span>
      </footer>
    </div>

</html>
